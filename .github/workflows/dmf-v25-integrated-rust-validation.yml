name: DMF v25 integrated Rust validation

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - name: Materialize source archive
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dmf-v25-rust-validation/work
          cat dmf-v25-rust-validation/source.tgz.b64.part-* \
            | base64 -d \
            | tar -xzf - -C dmf-v25-rust-validation/work
          test "$(cat dmf-v25-rust-validation/source.tgz.b64.part-* | base64 -d | sha256sum | cut -d' ' -f1)" = "64135dd7838f1bb56c0b9aba1f5d69c538a085f84f2a60d2bdf36cf9e7897f73"
          sed -i 's/pub fn verify(&self, \*, value:/pub fn verify(\&self, value:/' \
            dmf-v25-rust-validation/work/crates/dmf-integrated-memory/src/lib.rs

      - name: Install pinned Rust toolchain
        shell: bash
        run: |
          set -euo pipefail
          rustup toolchain install 1.97.1 --profile minimal --component rustfmt --component clippy
          rustup override set 1.97.1 --path dmf-v25-rust-validation/work

      - name: Format
        working-directory: dmf-v25-rust-validation/work
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifacts
          cargo fmt --all 2>&1 | tee artifacts/rustfmt-apply.log
          cargo fmt --all -- --check 2>&1 | tee artifacts/rustfmt-check.log
          touch artifacts/fmt.ok

      - name: Clippy
        working-directory: dmf-v25-rust-validation/work
        shell: bash
        run: |
          set -euo pipefail
          cargo clippy --workspace --all-targets --all-features -- -D warnings 2>&1 \
            | tee artifacts/clippy.log
          touch artifacts/clippy.ok

      - name: Tests
        working-directory: dmf-v25-rust-validation/work
        shell: bash
        run: |
          set -euo pipefail
          cargo test --workspace --all-targets 2>&1 | tee artifacts/test.log
          cargo test --workspace --all-targets -- --list 2>&1 | tee artifacts/test-list.log
          touch artifacts/tests.ok

      - name: Executable self-checks
        working-directory: dmf-v25-rust-validation/work
        shell: bash
        run: |
          set -euo pipefail
          cargo run --quiet --bin dmf-experienced-colleague-check \
            | tee artifacts/experienced-colleague-selfcheck.json
          cargo run --quiet --bin dmf-integrated-memory-check \
            | tee artifacts/integrated-memory-selfcheck.json
          touch artifacts/selfchecks.ok

      - name: Build compiler receipt
        if: always()
        working-directory: dmf-v25-rust-validation/work
        shell: bash
        run: |
          set -u
          mkdir -p artifacts
          export CARGO_VERSION="$(cargo --version 2>&1 || true)"
          export RUSTC_VERSION="$(rustc --version 2>&1 || true)"
          export RUSTFMT_VERSION="$(rustfmt --version 2>&1 || true)"
          export CLIPPY_VERSION="$(cargo clippy --version 2>&1 || true)"
          export TEST_COUNT="$(grep -c ': test$' artifacts/test-list.log 2>/dev/null || true)"
          export GITHUB_SHA_VALUE="$GITHUB_SHA" GITHUB_RUN_ID_VALUE="$GITHUB_RUN_ID"
          python3 - <<'PY'
          import hashlib, json, os
          from pathlib import Path

          root = Path('.')
          files = [
              'Cargo.toml',
              'Cargo.lock',
              'rust-toolchain.toml',
              'crates/dmf-experienced-colleague/Cargo.toml',
              'crates/dmf-experienced-colleague/src/lib.rs',
              'crates/dmf-experienced-colleague/src/bin/dmf-experienced-colleague-check.rs',
              'crates/dmf-integrated-memory/Cargo.toml',
              'crates/dmf-integrated-memory/src/lib.rs',
              'crates/dmf-integrated-memory/src/bin/dmf-integrated-memory-check.rs',
          ]
          hashes = {
              path: hashlib.sha256((root / path).read_bytes()).hexdigest()
              for path in files
              if (root / path).is_file()
          }
          def load_json(path):
              try:
                  return json.loads((root / path).read_text())
              except Exception:
                  return None
          experienced = load_json('artifacts/experienced-colleague-selfcheck.json')
          integrated = load_json('artifacts/integrated-memory-selfcheck.json')
          commands = {
              'cargo_fmt_check': (root / 'artifacts/fmt.ok').exists(),
              'cargo_clippy_deny_warnings': (root / 'artifacts/clippy.ok').exists(),
              'cargo_test_workspace_all_targets': (root / 'artifacts/tests.ok').exists(),
              'cargo_run_experienced_selfcheck': bool(experienced and experienced.get('status') == 'passed'),
              'cargo_run_integrated_selfcheck': bool(integrated and integrated.get('status') == 'passed'),
          }
          receipt = {
              'schema': 'dmf.rust-validation.v25',
              'project_version': '0.25.0',
              'toolchain': {
                  'cargo': os.environ.get('CARGO_VERSION', ''),
                  'rustc': os.environ.get('RUSTC_VERSION', ''),
                  'rustfmt': os.environ.get('RUSTFMT_VERSION', ''),
                  'clippy': os.environ.get('CLIPPY_VERSION', ''),
              },
              'commands': commands,
              'test_count': int(os.environ.get('TEST_COUNT') or 0),
              'source_sha256': hashes,
              'selfchecks': {
                  'experienced_colleague': experienced,
                  'integrated_memory': integrated,
              },
              'github': {
                  'repository': os.environ.get('GITHUB_REPOSITORY'),
                  'commit_sha': os.environ.get('GITHUB_SHA_VALUE'),
                  'run_id': os.environ.get('GITHUB_RUN_ID_VALUE'),
                  'runner_os': os.environ.get('RUNNER_OS'),
              },
              'authority_execute': False,
              'authority_release': False,
          }
          receipt['passed'] = all(commands.values()) and receipt['test_count'] >= 80 and len(hashes) == len(files)
          (root / 'artifacts/rust-validation.json').write_text(
              json.dumps(receipt, indent=2, sort_keys=True) + '\n'
          )
          PY
          tar -czf artifacts/formatted-rust-source.tgz \
            Cargo.toml Cargo.lock rust-toolchain.toml crates
          sha256sum artifacts/formatted-rust-source.tgz \
            > artifacts/formatted-rust-source.tgz.sha256
          cat artifacts/rust-validation.json

      - name: Enforce receipt success
        working-directory: dmf-v25-rust-validation/work
        shell: bash
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path
          receipt = json.loads(Path('artifacts/rust-validation.json').read_text())
          assert receipt['passed'] is True, receipt
          PY

      - name: Upload validation evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dmf-v25-integrated-rust-validation
          path: dmf-v25-rust-validation/work/artifacts/
          if-no-files-found: error
