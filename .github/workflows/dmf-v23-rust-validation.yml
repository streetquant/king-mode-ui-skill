name: DMF v23 Rust validation

on:
  push:
    branches:
      - tmp-dmf-v23-rust-validation-20260818
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Materialize source archive
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dmf-v23-rust-validation/work
          cat dmf-v23-rust-validation/src.tgz.b64.part-* | base64 -d | tar -xzf - -C dmf-v23-rust-validation/work
      - name: Install pinned Rust toolchain
        shell: bash
        run: |
          set -euo pipefail
          rustup toolchain install 1.97.1 --profile minimal --component rustfmt --component clippy
          rustup override set 1.97.1 --path dmf-v23-rust-validation/work
      - name: Format source
        working-directory: dmf-v23-rust-validation/work
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifacts
          cargo fmt --all 2>&1 | tee artifacts/rustfmt-apply.log
          cargo fmt --all -- --check 2>&1 | tee artifacts/rustfmt-check.log
      - name: Clippy
        working-directory: dmf-v23-rust-validation/work
        shell: bash
        run: |
          set -euo pipefail
          cargo clippy --workspace --all-targets --all-features -- -D warnings 2>&1 | tee artifacts/clippy.log
      - name: Tests
        working-directory: dmf-v23-rust-validation/work
        shell: bash
        run: |
          set -euo pipefail
          cargo test --workspace --all-targets 2>&1 | tee artifacts/test.log
          cargo test --workspace --all-targets -- --list 2>&1 | tee artifacts/test-list.log
      - name: Executable self-check
        working-directory: dmf-v23-rust-validation/work
        shell: bash
        run: |
          set -euo pipefail
          cargo run --quiet --bin dmf-experienced-colleague-check | tee artifacts/selfcheck.json
      - name: Build compiler receipt
        if: always()
        working-directory: dmf-v23-rust-validation/work
        shell: bash
        run: |
          set -u
          mkdir -p artifacts
          export CARGO_VERSION="$(cargo --version 2>&1 || true)"
          export RUSTC_VERSION="$(rustc --version 2>&1 || true)"
          export RUSTFMT_VERSION="$(rustfmt --version 2>&1 || true)"
          export CLIPPY_VERSION="$(cargo clippy --version 2>&1 || true)"
          export TEST_COUNT="$(grep -c ': test$' artifacts/test-list.log 2>/dev/null || true)"
          export GITHUB_SHA_VALUE="$GITHUB_SHA" GITHUB_RUN_ID_VALUE="$GITHUB_RUN_ID"
          python3 - <<'PY'
          import hashlib, json, os
          from pathlib import Path
          root = Path('.')
          files = [
              'Cargo.toml', 'Cargo.lock', 'rust-toolchain.toml',
              'crates/dmf-experienced-colleague/Cargo.toml',
              'crates/dmf-experienced-colleague/src/lib.rs',
              'crates/dmf-experienced-colleague/src/bin/dmf-experienced-colleague-check.rs',
          ]
          hashes = {p: hashlib.sha256((root / p).read_bytes()).hexdigest() for p in files}
          selfcheck = None
          try:
              selfcheck = json.loads((root / 'artifacts/selfcheck.json').read_text())
          except Exception:
              pass
          commands = {
              'cargo_fmt_check': (root / 'artifacts/rustfmt-check.log').exists(),
              'cargo_clippy_deny_warnings': (root / 'artifacts/clippy.log').exists(),
              'cargo_test_workspace_all_targets': (root / 'artifacts/test.log').exists(),
              'cargo_run_selfcheck': bool(selfcheck and selfcheck.get('status') == 'passed'),
          }
          receipt = {
              'schema': 'dmf.rust-validation.v2',
              'project_version': '0.23.0',
              'toolchain': {
                  'cargo': os.environ.get('CARGO_VERSION', ''),
                  'rustc': os.environ.get('RUSTC_VERSION', ''),
                  'rustfmt': os.environ.get('RUSTFMT_VERSION', ''),
                  'clippy': os.environ.get('CLIPPY_VERSION', ''),
              },
              'commands': commands,
              'test_count': int(os.environ.get('TEST_COUNT') or 0),
              'source_sha256': hashes,
              'selfcheck': selfcheck,
              'github': {
                  'repository': os.environ.get('GITHUB_REPOSITORY'),
                  'commit_sha': os.environ.get('GITHUB_SHA_VALUE'),
                  'run_id': os.environ.get('GITHUB_RUN_ID_VALUE'),
                  'runner_os': os.environ.get('RUNNER_OS'),
              },
          }
          receipt['passed'] = all(commands.values()) and receipt['test_count'] >= 56
          (root / 'artifacts/rust-validation.json').write_text(json.dumps(receipt, indent=2, sort_keys=True) + '\n')
          PY
          tar -czf artifacts/formatted-rust-source.tgz Cargo.toml Cargo.lock rust-toolchain.toml crates
          sha256sum artifacts/formatted-rust-source.tgz > artifacts/formatted-rust-source.tgz.sha256
          cat artifacts/rust-validation.json
      - name: Upload validation evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dmf-v23-rust-validation
          path: dmf-v23-rust-validation/work/artifacts/
          if-no-files-found: error
